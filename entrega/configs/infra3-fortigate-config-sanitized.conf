# Infraestructura 3 - FortiGate
# Extracto sanitizado. PSK/contraseñas omitidas.

config system interface
    edit "port1"
        set ip 198.51.100.22 255.255.255.252
        set allowaccess ping https ssh http
    next
    edit "port2"
        set ip 10.21.39.129 255.255.255.240
        set allowaccess ping
    next
end

# Default route:
# 0.0.0.0/0 via 198.51.100.21, port1

# VIP:
# WEB-HTTPS-VIP
# external 198.51.100.22:443 -> mapped 10.21.39.130:443

# Firewall policy:
# WAN-to-WEB-HTTPS
# port1 -> port2, destination WEB-HTTPS-VIP, service HTTPS, NAT disabled

config vpn ipsec phase1-interface
    edit "VPN-REMOTE-SSH"
        set type dynamic
        set interface "port1"
        set mode aggressive
        set peertype any
        set net-device disable
        set mode-cfg enable
        set proposal des-md5 des-sha1
        set wizard-type dialup-forticlient
        set xauthtype auto
        set authusrgrp "VPN-USERS"
        set ipv4-start-ip 10.99.99.10
        set ipv4-end-ip 10.99.99.20
        set ipv4-netmask 255.255.255.0
        set dns-mode auto
        set ipv4-split-include "VPN-REMOTE-SSH_split"
        set save-password enable
        # psksecret OMITIDA
    next
end

config vpn ipsec phase2-interface
    edit "VPN-REMOTE-SSH"
        set phase1name "VPN-REMOTE-SSH"
        set proposal des-md5 des-sha1
    next
end

# Política VPN:
# incoming VPN-REMOTE-SSH -> outgoing port2
# source VPN-REMOTE-SSH_range
# destination SERVER-NETX (10.21.39.128/28)
# service SSH
# NAT disabled
